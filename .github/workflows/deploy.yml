name: GitHub Pages 배포

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  # 배포 도중 끊기지 않도록 main에서는 앞선 실행을 취소하지 않습니다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 타입 검사
        run: npm run check

      - name: 린트
        run: npm run lint

      - name: 단위 테스트
        run: npm run test

      - name: 빌드
        run: npm run build
        env:
          # 공개되어도 되는 값만 저장소 Variables(Settings → Secrets and variables → Actions → Variables)에 둡니다.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # PR에서는 검사·빌드만 하고, main에 올라갔을 때만 배포합니다.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
